name: Release artifact

# Builds a deployable bundle off the serving host. docs.aporto.tech runs from
# /var/www/docs.aporto.tech-candidate-<sha> on a host that also serves NewAPI, so the
# build must not happen there. The bundle is the whole project minus .git —
# the same shape as the existing candidate directories — started with
# `next start -p <port> -H 127.0.0.1`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: true
        default: main

jobs:
  build:
    name: Build deployable bundle
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          # Must match the runtime on the serving host (Node 24).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Install Playwright outside the project
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Smoke-test rendered locales
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3002 > "$RUNNER_TEMP/docs.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run check:rendered
          cp scripts/check-docs-browser.mjs "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw"
          node check-docs-browser.mjs http://127.0.0.1:3002 "$GITHUB_WORKSPACE/browser-out"

      - name: Assemble the bundle
        id: bundle
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$sha" > REVISION
          # Written outside the tree so tar never archives its own output.
          tar --exclude=./.git -czf "$RUNNER_TEMP/site-$sha.tar.gz" .
          mv "$RUNNER_TEMP/site-$sha.tar.gz" .
          ls -lh "site-$sha.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ steps.bundle.outputs.sha }}
          path: site-${{ steps.bundle.outputs.sha }}.tar.gz
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-smoke-${{ steps.bundle.outputs.sha }}
          path: |
            browser-out
            ${{ runner.temp }}/docs.log
          retention-days: 14
